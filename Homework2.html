 <html>

    <head>
        <!-- this is the picture-->
        <link rel="stylesheet" href="style-1.css">
    </head>

<header>
    <title>
        homework1
    </title>
    <div class="header">
    <table width="100%">
        <tr>
            <td align="left">
    <img src="ovy.jpg" alt="this is where the logo is" width="175" height="175">
            </td>
            <td align="center">
                <h1> We Won't Hurt You Medical Patient Registration Form</h1>
            </td>
            
            <td valign="bottom" align="right">
                Today's Date is:
                <span id="today" title ="Today"></span>
            </td>
            </tr>
    </table>
    </div>
</header>


<body>
    <div class="bodystyle">
    <form action = "homework2_thanks.html">
    <!-- table alignment -->
    <table align="center" width="100%" class="tableform">
        <tr>
            <!-- Nomenclature on same line -->
            <td align = "right">
            <label for="fname">First Name:</label>
            <input type="text" 
            id="fname" 
            name="fname" 
            placeholder="John" 
            maxlength="30"
            title="First Name"
            pattern="[a-zA-Z']{1,30}"
            onblur="validatefname()"
            required>
            <span class="error" id="fname-error"></span>
            </td>

            <td align="right">
            <label for="midinitial">Middle Initial:</label>
            <input type="text" 
            id="midinitial" 
            name="midinitial" 
            placeholder="A" 
            maxlength="1"
            title="Middle Initial"
            pattern="[a-zA-Z']{0,1}"
            onblur="validateMidinitial()">
            <span class="error" id="mini-error"></span>
            </td>

            <td align="right">
            <label for="lname">Last Name:</label>
            <input type="text" 
            id="lname" 
            name="lname"
            placeholder="Doe"
            maxlength="30"
            title="Last Name"
            pattern="[a-zA-Z']{1,30}"
            onblur="validatelname()"
            required>
            </td>
        </tr>

        <tr>
            <!-- User ID text --> 
            <td align="right">
            <label for="UserID">Desired UserID: </label>
            <input type="text" 
            id="UserID" 
            maxlength="20"
            title="User ID">
            </td>
        </tr>

        <tr> 
            <!-- email address: pattern taken from Professor Messinger Hw3 example-->

            <td align="right">
            <label for="Email">Email:</label>
            <input name="email" 
            id="Email" 
            type="email" 
            placeholder="johndoe@gmail.com"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,20}$"
            title="Email">
            </td>
        </tr> 
        <tr>
            <!-- Phone Number --> 
            <td align="right">
                <label for="phoneNum">Phone Number:</label>
                <input type="text"
                id="phoneNum"
                name="phoneNum"
                placeholder="(123)456-7890"
                minlength="10"
                maxlength="14"
                required>
        </tr>
        <tr>
            <!-- Date of Birth -->

            <td align="right">
            <label for="dateob">Date of Birth:</label>
            <input type="date" 
            id="dateob" 
            name="dateob" 
            title="Date of Birth"
            onblur="validateDob()"
            required>
            </td>
        </tr>
        <tr>
            <!-- Social Security Number -->

            <td align="right">
            <label for="SSN">SSN:</label>
            <input type="password" 
            id="SSN" 
            name="SSN" 
            minlength="9" 
            maxlength="11"
            title="Password"
            required>
            </td>
        </tr>
        <tr>
            <!-- Address 1 section -->
            <td align="right">
            <label for="Addy1">Address 1:</label>
            <input type="text" 
            id="Addy1" 
            name="Addy1" 
            placeholder="123 Beverly Hills" 
            maxlength="30" 
            title="Address 1" 
            required>
            </td>

        </tr>
        <tr>
            <!-- Address 2 Section -->
            <td align="right">
            <label for="Addy2">Address 2:</label>
            <input type="text" 
                    id="Addy2" 
                    name="Addy2" 
                    placeholder="Apt 1A"
                    maxlength="30"
                    title="Address 2">
            </td>

        </tr>
        <tr>
            <!-- City State on same line --> 
            <td align="right">
            <label for="City">City:</label>
            <input type="text" 
            id="City" 
            name="City" 
            placeholder="Houston" 
            maxlength="30" 
            title ="City" 
            required>
            </td>
            <td align="right">
                <label for="State">State:</label>
                <select name="State" id="State" title="State">
                <option value=""></option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="DC">District Of Columbia</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="PR">Puerto Rico</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
            </select>
            </td>

            <td align="right">
                <!-- Zip Code --> 
                <label for="Zip">Zip Code:</label>
                <input type="text" 
                name="Zip" 
                id="Zip" 
                placeholder="12345" 
                minlength="5" 
                maxlength="10" 
                title="Zip Code" 
                required>
            </td>

        </tr>

        <tr>
            <!-- Check Mark Boxes --> 
            <td align="right">
                <label for="PrevCon">Have you had any of these previous COVID-19 vaccines?</label>
            </td>
            <td align="left" class="PrevCon">
                <input type="checkbox" name="Moderna">
                <span>Moderna</span><br>
                <input type="checkbox" name="Pfizer">
                <span>Pfizer</span><br>
                <input type="checkbox" name="John">
                <span>Johnson and Johnson</span><br>
                <input type="checkbox" name="Novavax">
                <span>Novavax</span><br>
                <input type="checkbox" name="BioNTech">
                <span>BioNTech</span><br>
                <input type="checkbox" name="None">
                <span>None</span><br>
            </td>
        </tr>
        <tr> </tr>
        <tr>
            <!-- Gender radio button -->

            <td align="right">
                <label for="gender">Sex:</label>
            </td>
            <td align="left">
                <input type="radio" 
                name="sexVal" 
                value="Male"
                title="Male"
                required>
                <span>Male</span>
            </td>
            <td align="left">
                <input type="radio" 
                name="sexVal" 
                value="Female"
                title="Female">
                <span>Female</span>
            </td>
            <td align="left">
                <input type="radio" 
                name="sexVal" 
                value="other"
                title="Other">
                <span>Other</span>
            </td>

        </tr>
        <tr>
            <!-- Insurance Radio Button --> 

            <td align="right">
                <label for="InsuranceCheck">Do you have insurance?</label>
            </td>
            <td align="left">
                <input type="radio" 
                name="insureVal" 
                value="Yes"
                title="Yes"
                required>
                <span>Yes</span>
            </td>
            <td align="left">
                <input type="radio" 
                name="insureVal" 
                value="No"
                title="No">
                <span>No</span>
            </td>
        </tr>
        <tr>
            <!-- Drug check radio button --> 
            <td align="right">
                <label for="DrugCheck">Are you on any current medication?</label>
            </td>
            <td align="left">
                <input type="radio" 
                name="drugVal" 
                value="Yes"
                title="Yes"
                required>
                <span>Yes</span>
            </td>
            <td align="left">
                <input type="radio" 
                name="drugVal" 
                value="No"
                title="No">
                <span>No</span>
            </td>
        </tr>
        <tr>
            <!-- Feeling Slide Bar --> 

            <td align="right">
                <label for="FeelingScale">How are you feeling today? 10 being very good.</label>
                </td>
                <td align = "center">
                &nbsp;1<input type="range" id="FeelingScale" min="1" max="10" step="1" list="feelingVals">&nbsp;10
                <datalist id="feelingVals">
                    <option value="1"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                    <option value="5"></option>
                    <option value="6"></option>
                    <option value="7"></option>
                    <option value="8"></option>
                    <option value="9"></option>
                    <option value="10"></option>
                </datalist>
            </td>
        </tr>

        <tr>
            <td align="right">
                <label for="About">Please describe your symptoms:</label><br>
                </td>
                <td>
                <textarea name="About" 
                rows="5" 
                cols="50" 
                placeholder="Please describe more here"></textarea>
            </td>

        <tr>
            <!-- Submit Button --> 

            <td align="right">
                <input type="submit" value="Submit">
            </td>
            <!-- Reset Button -->
            <td>
                <input type="reset" value="Reset">
            </td>
        </tr>
    </table>
    </form>
    </div>
</body>
    <div class = "body">
    <footer>
        <p> We won't hurt you Medical <a href="https://google.com">Contact us!</a><p>
    </div>
    </footer>

    <script>
    const d = new Date();
    let text = d.toLocaleDateString();
    document.getElementById("today").innerHTML = text;
    </script>
</html>
